        const weight = Number(tempWeight || userProfile.currentWeight || 0);
        const heightM = Number(tempHeight || userProfile.height || 0) / 100;
        if (weight > 0 && heightM > 0) {
          const est = estimatesFromBMI({ weightKg: weight, heightM, age: userProfile.age, sex: userProfile.sex || 'male' });
          resultWrap.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-4 gap-3 text-sm"><div class="p-3 rounded-lg bg-zinc-900 border border-zinc-700"><div class="text-zinc-400">BMI</div><div class="text-white font-bold text-lg">${est.BMI}</div></div><div class="p-3 rounded-lg bg-zinc-900 border border-zinc-700"><div class="text-zinc-400">Body Fat % (fallback)</div><div class="text-white font-bold text-lg">${est.bodyFatPercent}%</div></div><div class="p-3 rounded-lg bg-zinc-900 border border-zinc-700"><div class="text-zinc-400">Lean Body Mass</div><div class="text-white font-bold text-lg">${est.leanBodyMassKg} kg</div></div><div class="p-3 rounded-lg bg-zinc-900 border border-zinc-700"><div class="text-zinc-400">Total Body Water</div><div class="text-white font-bold text-lg">${est.totalBodyWaterKg} kg (${est.totalBodyWaterPercent}%)</div></div></div><p class="text-xs text-zinc-400 mt-2">No image model configured — showing BMI-based fallback estimates.</p>`;
        } else {
          resultWrap.innerHTML = '<p class="text-sm text-yellow-300">No image model configured and missing weight/height for fallback.</p>';
        }
      }
    };

    input.addEventListener('change', onFile);
    btn.addEventListener('click', onChoose);
    estBtn.addEventListener('click', onEstimate);
    clearBtn.addEventListener('click', onClear);

    return () => {
      input.removeEventListener('change', onFile);
      btn.removeEventListener('click', onChoose);
      estBtn.removeEventListener('click', onEstimate);
      clearBtn.removeEventListener('click', onClear);
    };
  }, [tempWeight, tempHeight, userProfile.age, userProfile.currentWeight, userProfile.height, userProfile.sex]);

  const bmiCategory = useMemo(() => {
    if (!bmi) return null;
    const b = Number(bmi);
    if (b < 18.5) return { label: 'Underweight', color: 'text-blue-400', bg: 'bg-blue-500/10', border: 'border-blue-500/40' };
    if (b < 25) return { label: 'Normal Weight', color: 'text-emerald-400', bg: 'bg-emerald-500/10', border: 'border-emerald-500/40' };
    if (b < 30) return { label: 'Overweight', color: 'text-yellow-400', bg: 'bg-yellow-500/10', border: 'border-yellow-500/40' };
    return { label: 'Obese', color: 'text-orange-400', bg: 'bg-orange-500/10', border: 'border-orange-500/40' };
  }, [bmi]);

  const healthRange = useMemo(() => {
    const heightM = Number(tempHeight || 0) / 100;
    if (heightM <= 0) return null;
    const minWeight = (18.5 * heightM * heightM).toFixed(1);
    const maxWeight = (24.9 * heightM * heightM).toFixed(1);
    return { min: minWeight, max: maxWeight };
  }, [tempHeight]);

  return (
    <div className="max-w-4xl mx-auto px-4 py-8">
      <h2 className="text-3xl font-bold mb-8">📐 BMI Calculator</h2>

      <div className="space-y-6">
        {/* Input Section */}
        <div className="rounded-xl border border-zinc-700 bg-zinc-800/50 p-6">
          <h3 className="text-lg font-bold mb-6">Enter Your Measurements</h3>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* Weight Input */}
            <div>
              <label className="block text-sm font-semibold text-zinc-300 mb-2">Weight (kg)</label>
              <input
                type="number"
                value={tempWeight}
                onChange={(e) => setTempWeight(e.target.value)}
                placeholder="Enter weight in kg"
                min="0"
                step="0.1"
                className="w-full rounded-lg border border-zinc-600 bg-zinc-900 px-4 py-3 text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-orange-500/50"
              />
              <p className="text-xs text-zinc-500 mt-2">Examples: 70, 65.5, 80</p>
            </div>

            {/* Height Input */}
            <div>
              <label className="block text-sm font-semibold text-zinc-300 mb-2">Height (cm)</label>
              <input
                type="number"
                value={tempHeight}
                onChange={(e) => setTempHeight(e.target.value)}
                placeholder="Enter height in cm"
                min="0"
                step="0.1"
                className="w-full rounded-lg border border-zinc-600 bg-zinc-900 px-4 py-3 text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-orange-500/50"
              />
              <p className="text-xs text-zinc-500 mt-2">Examples: 175, 162.5, 180</p>
            </div>
            
            
          </div>
        </div>

        {/* BMI Result Display */}
        {bmi ? (
          <>
            <div className={`rounded-xl border ${bmiCategory?.border} ${bmiCategory?.bg} p-8 text-center transition-all`}>
              <p className="text-zinc-400 mb-2 text-lg">Your BMI</p>
              <p className={`text-6xl font-bold ${bmiCategory?.color}`}>{bmi}</p>
              <p className={`mt-4 text-2xl font-semibold ${bmiCategory?.color}`}>{bmiCategory?.label}</p>
            </div>

            {/* Health Range Info */}
            {healthRange && (
              <div className="rounded-xl border border-emerald-500/40 bg-emerald-500/10 p-6">
                <h3 className="text-lg font-bold text-emerald-400 mb-4">✓ Healthy Weight Range</h3>
                <p className="text-white mb-2">For your height of {tempHeight} cm:</p>
                <p className="text-emerald-300 text-lg font-semibold">{healthRange.min} kg — {healthRange.max} kg</p>
                <p className="text-zinc-400 text-sm mt-4">This range is based on a BMI of 18.5–24.9 (considered normal).</p>
              </div>
            )}

            {/* BMI Categories Chart */}
            <div className="rounded-xl border border-zinc-700 bg-zinc-800/50 p-6">
              <h3 className="text-lg font-bold mb-4">📊 BMI Categories</h3>
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div className={`rounded-lg bg-blue-500/10 border border-blue-500/30 p-4 transition ${bmi && Number(bmi) < 18.5 ? 'ring-2 ring-blue-400' : ''}`}>
                  <p className="text-sm font-semibold text-blue-400">Underweight</p>
                  <p className="text-lg font-bold text-white mt-2">BMI {'<'} 18.5</p>
                  <p className="text-xs text-blue-300 mt-2">Below normal range</p>
                </div>
                <div className={`rounded-lg bg-emerald-500/10 border border-emerald-500/30 p-4 transition ${bmi && Number(bmi) >= 18.5 && Number(bmi) < 25 ? 'ring-2 ring-emerald-400' : ''}`}>
                  <p className="text-sm font-semibold text-emerald-400">Normal</p>
                  <p className="text-lg font-bold text-white mt-2">BMI 18.5–24.9</p>
                  <p className="text-xs text-emerald-300 mt-2">Healthy range</p>
                </div>
                <div className={`rounded-lg bg-yellow-500/10 border border-yellow-500/30 p-4 transition ${bmi && Number(bmi) >= 25 && Number(bmi) < 30 ? 'ring-2 ring-yellow-400' : ''}`}>
                  <p className="text-sm font-semibold text-yellow-400">Overweight</p>
                  <p className="text-lg font-bold text-white mt-2">BMI 25–29.9</p>
                  <p className="text-xs text-yellow-300 mt-2">Above normal range</p>
                </div>
                <div className={`rounded-lg bg-orange-500/10 border border-orange-500/30 p-4 transition ${bmi && Number(bmi) >= 30 ? 'ring-2 ring-orange-400' : ''}`}>
                  <p className="text-sm font-semibold text-orange-400">Obese</p>
                  <p className="text-lg font-bold text-white mt-2">BMI {'≥'} 30</p>
                  <p className="text-xs text-orange-300 mt-2">Health concerns</p>
                </div>
              </div>
            </div>

            {/* About BMI */}
            <div className="rounded-xl border border-zinc-700 bg-zinc-800/50 p-6">
              <h3 className="text-lg font-bold mb-4">💡 About BMI</h3>
              <div className="space-y-3 text-sm text-zinc-300">
                <p><strong>What is BMI?</strong> Body Mass Index is a measure of body fat based on height and weight.</p>
                <p><strong>Formula:</strong> BMI = Weight (kg) ÷ Height (m)²</p>
                <p><strong>Limitations:</strong> BMI doesn't account for muscle mass, bone density, or body composition. Athletes may have a high BMI despite being fit.</p>
                <p><strong>Disclaimer:</strong> This is a screening tool only. Consult a healthcare professional for personalized health advice.</p>
              </div>
            </div>

            {/* Photo upload for experimental image-based estimates (moved near BMI results) */}
            <div className="mt-6">
              <div className="rounded-xl border border-zinc-700 bg-zinc-900/50 p-4">
                <h4 className="text-sm font-semibold text-white mb-2">📷 Photo-based Estimate (experimental)</h4>
                <p className="text-xs text-zinc-400 mb-3">Upload a clear full-body photo for an experimental image-based estimate of body fat / water / muscle percentages. Accuracy varies greatly; for reliable results use a validated model or clinical scan (BIA/DEXA).</p>
                <div className="flex items-center gap-3">
                  <input id="bmi-photo-input" type="file" accept="image/*" className="hidden" />
                  <button type="button" id="bmi-photo-button" className="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold">Upload Photo</button>
                  <button type="button" id="bmi-photo-estimate" className="rounded-lg bg-emerald-500 px-4 py-2 text-sm font-semibold">Estimate from Image</button>
                  <button type="button" id="bmi-photo-clear" className="rounded-lg bg-red-600 px-3 py-2 text-sm font-semibold">Clear</button>
                </div>
                <div id="bmi-photo-preview" className="mt-3"></div>
                <div id="bmi-photo-result" className="mt-3"></div>
              </div>
            </div>

            {/* Quick Body Estimates (moved from Profile) */}
            <div className="mt-6">
              {tempWeight && tempHeight ? (
                (() => {
                  const weight = Number(tempWeight);
                  const heightM = Number(tempHeight) / 100;
                  const est = estimatesFromBMI({ weightKg: weight, heightM, age: userProfile.age, sex: userProfile.sex || 'male' });
                  return (
                    <div className="rounded-xl border border-zinc-700 bg-zinc-800/50 p-4">
                      <h4 className="text-lg font-semibold text-white mb-2">Quick Body Estimates (population-level)</h4>
                      <p className="text-sm text-zinc-400 mb-2">These are rough estimates derived from BMI formulas. For accurate body composition use BIA, DEXA, or skinfold tests.</p>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
                        <div className="p-3 rounded-lg bg-zinc-900 border border-zinc-700">
                          <div className="text-zinc-400">BMI</div>
                          <div className="text-white font-bold text-lg">{est.BMI}</div>
                        </div>
                        <div className="p-3 rounded-lg bg-zinc-900 border border-zinc-700">
                          <div className="text-zinc-400">Body Fat %</div>
                          <div className="text-white font-bold text-lg">{est.bodyFatPercent}%</div>
                        </div>
                        <div className="p-3 rounded-lg bg-zinc-900 border border-zinc-700">
                          <div className="text-zinc-400">Lean Body Mass</div>
                          <div className="text-white font-bold text-lg">{est.leanBodyMassKg} kg</div>
                        </div>
                        <div className="p-3 rounded-lg bg-zinc-900 border border-zinc-700">
                          <div className="text-zinc-400">Total Body Water</div>
                          <div className="text-white font-bold text-lg">{est.totalBodyWaterKg} kg ({est.totalBodyWaterPercent}%)</div>
                        </div>
                      </div>
                    </div>
                  );
                })()
              ) : (
                <div className="rounded-xl border border-zinc-700 bg-zinc-900/40 p-4 text-zinc-400">Enter Weight and Height above to see quick estimates</div>
              )}
            </div>
          </>
        ) : (
          <div className="rounded-xl border border-yellow-500/40 bg-yellow-500/10 p-8 text-center">
            <p className="text-yellow-400 text-lg">⚠️ Enter your weight and height to calculate BMI</p>
          </div>
        )}
      </div>
    </div>
  );
}

function SettingsPage({ userProfile, setUserProfile }) {
  const handleClearData = () => {
    if (confirm('Are you sure? This will delete all your data.')) {
      setUserProfile(initialProfile);
      Storage.saveProfile(initialProfile);
      Storage.saveProgress([]);
      alert('Data cleared successfully!');
    }
  };

  const handleExportPdf = () => {
    const progress = Storage.loadProgress();
    const profile = userProfile || {};
    const currentWeight = Number(profile.currentWeight) || 0;
    const heightCm = Number(profile.height) || 0;
    const bmiValue = currentWeight > 0 && heightCm > 0 ? (currentWeight / (((heightCm / 100) ** 2))).toFixed(1) : 'N/A';

    const workoutLevel = profile.workoutLevel || 'Intermediate';
    const workoutGroups = exerciseDatabase?.[workoutLevel]?.gym || exerciseDatabase?.Intermediate?.gym || [];
    const workoutSummary = workoutGroups.slice(0, 3).map((group) => {
      const exercises = (group.exercises || []).slice(0, 3).join(', ');
      return `<li><strong>${group.muscle}</strong>: ${exercises}</li>`;
    }).join('');

    const monthCount = Math.max(1, Number(profile.timeline) || 1);
    const dietSummary = Array.from({ length: monthCount }, (_, index) => {
      const monthNumber = index + 1;
      const targets = getDietTargets({
        currentWeight: profile.currentWeight,
        targetWeight: profile.targetWeight,
        timelineMonths: profile.timeline,
        goal: profile.goal,
        baseCalories: Number(profile.calorieTarget) || 2200,
        baseProtein: 150,
        calorieTarget: Number(profile.calorieTarget) || null,
      });
      const plan = getDietMeals(
        profile.dietType || 'Omnivore (Mixed)',
        Number(profile.monthlyBudget) || 0,
        monthNumber,
        monthCount,
        targets.calories,
        targets.protein,
        profile.workoutTime,
        profile.currentWeight,
        profile.targetWeight,
        profile.timeline,
        profile.goal
      );
      const meals = [...(plan?.firstHalf || []), ...(plan?.secondHalf || [])].slice(0, 6);
      const mealList = meals.map((meal) => `<li>${meal.timing || 'Meal'} — ${meal.meal} (${meal.quantity}) — ${meal.calories} kcal, ${meal.protein}g protein</li>`).join('');
      return `
        <div class="section-card">
          <h3>Month ${monthNumber}</h3>
          <p><strong>Target:</strong> ${targets.calories} kcal • ${targets.protein}g protein</p>
          <ul>${mealList || '<li>No meal data available.</li>'}</ul>
        </div>
      `;
    }).join('');

    const progressRows = progress && progress.length ? progress.map((entry) => `
      <tr>
        <td>${entry.date || 'N/A'}</td>
        <td>${entry.weight || 'N/A'} kg</td>
        <td>${entry.chest || 'N/A'} cm</td>
        <td>${entry.waist || 'N/A'} cm</td>
        <td>${entry.notes || '—'}</td>
      </tr>
    `).join('') : '<tr><td colspan="5">No progress entries yet.</td></tr>';

    const html = `
      <!doctype html>
      <html>
        <head>
          <title>Fitness Transformer Report</title>
          <style>
            body { font-family: Arial, sans-serif; color: #111827; margin: 24px; }
            h1 { font-size: 28px; margin-bottom: 8px; }
            h2 { font-size: 22px; margin: 18px 0 10px; }
            h3 { font-size: 16px; margin: 12px 0 8px; }
            .meta { color: #4b5563; margin-bottom: 18px; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            th, td { border: 1px solid #d1d5db; padding: 8px 10px; text-align: left; vertical-align: top; }
            th { background: #f3f4f6; }
            ul { margin: 0 0 12px 18px; padding: 0; }
            li { margin: 6px 0; }
            .section-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-top: 12px; background: #f9fafb; }
            .label { font-weight: 700; }
          </style>
        </head>
        <body>
          <h1>Fitness Transformer</h1>
          <div class="meta">Exported: ${new Date().toLocaleString()}</div>

          <div class="section-card">
            <h2>Profile Information</h2>
            <table>
              <tr><th>Field</th><th>Value</th></tr>
              <tr><td class="label">Name</td><td>${profile.name || 'Not set'}</td></tr>
              <tr><td class="label">Age</td><td>${profile.age || 'N/A'}</td></tr>
              <tr><td class="label">Current Weight</td><td>${profile.currentWeight || 'N/A'} kg</td></tr>
              <tr><td class="label">Target Weight</td><td>${profile.targetWeight || 'N/A'} kg</td></tr>
              <tr><td class="label">Height</td><td>${profile.height || 'N/A'} cm</td></tr>
              <tr><td class="label">Goal</td><td>${profile.goal || 'Not set'}</td></tr>
              <tr><td class="label">Workout Level</td><td>${profile.workoutLevel || 'Not set'}</td></tr>
              <tr><td class="label">Diet Type</td><td>${profile.dietType || 'Not set'}</td></tr>
              <tr><td class="label">Workout Time</td><td>${profile.workoutTime || 'Not set'}</td></tr>
              <tr><td class="label">Timeline</td><td>${profile.timeline || 'N/A'} months</td></tr>
              <tr><td class="label">Calories Target</td><td>${profile.calorieTarget || 'N/A'} kcal</td></tr>
              <tr><td class="label">Monthly Budget</td><td>₹${Number(profile.monthlyBudget || 0).toLocaleString()}</td></tr>
            </table>
          </div>

          <div class="section-card">
            <h2>Workout Plan</h2>
            <ul>${workoutSummary || '<li>No workout summary available.</li>'}</ul>
          </div>

          <div class="section-card">
            <h2>Diet Plan</h2>
            ${dietSummary}
          </div>

          <div class="section-card">
            <h2>Progress Tracking</h2>
            <table>
              <tr><th>Date</th><th>Weight</th><th>Chest</th><th>Waist</th><th>Notes</th></tr>
              ${progressRows}
            </table>
          </div>

          <div class="section-card">
            <h2>BMI Information</h2>
            <p><strong>BMI:</strong> ${bmiValue}</p>
            <p><strong>Height:</strong> ${heightCm || 'N/A'} cm</p>
            <p><strong>Weight:</strong> ${currentWeight || 'N/A'} kg</p>
          </div>
        </body>
      </html>
    `;

    const printWindow = window.open('', '_blank', 'width=1100,height=900');
    if (!printWindow) {
      alert('Please allow pop-ups to export the fitness report as PDF.');
      return;
    }

    printWindow.document.write(html);
    printWindow.document.close();
    if (typeof printWindow.focus === 'function') {
      printWindow.focus();
    }
    setTimeout(() => {
      if (typeof printWindow.print === 'function') {
        printWindow.print();
      }
      setTimeout(() => {
        if (typeof printWindow.close === 'function') {
          printWindow.close();
        }
      }, 1000);
    }, 500);
  };

  return (
    <div className="max-w-3xl mx-auto px-4 py-8">
      <h2 className="text-3xl font-bold mb-8">⚙️ Settings</h2>

      <div className="space-y-6">
        <div className="rounded-xl border border-zinc-700 bg-zinc-800/50 p-6">
          <h3 className="text-xl font-bold mb-4">📘 How this tool works</h3>
          <p className="text-sm text-zinc-300 leading-7">
            Fitness Transformer helps you plan your transformation by combining your profile, goal, workout time,
            calorie target, and nutrition preferences. It tracks your current and target weight, calculates a realistic
            roadmap, and suggests custom workout and diet guidance month by month. All of your data is stored locally in
            your browser so the plan stays personalized to your progress.
          </p>
          <div className="mt-5 grid gap-2 text-sm text-zinc-300">
            <p>✓ Personal fitness planning based on your profile</p>
            <p>✓ Diet and calorie guidance according to your goal</p>
            <p>✓ Workout timing and nutrition scheduling</p>
            <p>✓ BMI and progress tracking for consistent improvement</p>
            <p>✓ Local data saving for a fast and private experience</p>
          </div>
        </div>

        <div className="space-y-4">
          <button
            onClick={handleExportPdf}
            className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition-all"
          >
            📄 Export Data (PDF)
          </button>

          <button
            onClick={handleClearData}
            className="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg transition-all"
          >
            🗑️ Clear All Data
          </button>
        </div>

        <p className="text-xs text-zinc-500">All data is stored locally in your browser. Export creates a printable PDF summary of your profile and progress.</p>
      </div>
    </div>
  );
}

function RestrictedNotice({ onGoProfile }) {
  return (
    <div className="max-w-4xl mx-auto px-4 py-12">
      <div className="rounded-2xl border border-zinc-700 bg-zinc-900/80 p-8 text-center">
        <h3 className="text-2xl font-bold text-white mb-4">Profile Required</h3>
        <p className="text-zinc-400 mb-6">Please complete your profile in the <strong>Profile</strong> tab to unlock this section (workouts, diet, progress, BMI).</p>
        <button onClick={onGoProfile} className="inline-flex items-center gap-2 rounded-lg bg-orange-500 px-5 py-3 font-semibold text-black hover:bg-orange-400 transition">Go to Profile</button>
      </div>
    </div>
  );
}

// ==================== MAIN APP ====================

function App() {
  const [currentPage, setCurrentPage] = useState('dashboard');
  const [userProfile, setUserProfile] = useState(() => Storage.loadProfile());

  useEffect(() => {
    Storage.saveProfile(userProfile);
  }, [userProfile]);

  // Determine whether required profile fields are completed
  const requiredFields = ['age','currentWeight','targetWeight','height','goal','workoutLevel','dietType','workoutTime'];
  const isProfileComplete = requiredFields.every((f) => {
    const v = userProfile?.[f];
    return v !== undefined && v !== null && (typeof v === 'number' ? !isNaN(v) : String(v).trim() !== '');
  });

  const goToProfile = () => setCurrentPage('profile');

  const pages = {
    dashboard: <DashboardPage userProfile={userProfile} />,
    profile: <ProfilePage userProfile={userProfile} setUserProfile={setUserProfile} />,
    workouts: isProfileComplete ? <WorkoutsPage userProfile={userProfile} /> : <RestrictedNotice onGoProfile={goToProfile} />,
    diet: isProfileComplete ? <DietPage userProfile={userProfile} /> : <RestrictedNotice onGoProfile={goToProfile} />,
    progress: isProfileComplete ? <ProgressPage userProfile={userProfile} /> : <RestrictedNotice onGoProfile={goToProfile} />,
    calories: <CaloriesCalculatorPage userProfile={userProfile} setUserProfile={setUserProfile} />,
    qa: <QAPage />,
    bmi: isProfileComplete ? <BMIPage userProfile={userProfile} /> : <RestrictedNotice onGoProfile={goToProfile} />,
    settings: <SettingsPage userProfile={userProfile} setUserProfile={setUserProfile} />,
  };

  return (
    <div className="min-h-screen bg-zinc-950">
      <Navigation currentPage={currentPage} setCurrentPage={setCurrentPage} isProfileComplete={isProfileComplete} />
      <main>
        {pages[currentPage]}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

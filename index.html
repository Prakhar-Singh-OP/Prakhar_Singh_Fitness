function parseTimeToken(m) {
  let h = Number(m[1]);
  const min = Number(m[2] || 0);
  const p = m[3];
  if (p === 'pm' && h !== 12) h += 12;
  if (p === 'am' && h === 12) h = 0;
  return h + min / 60;
}

function parseWorkoutRange(workoutTime) {
  const cleaned = workoutTime.toLowerCase().trim();
  const all = [...cleaned.matchAll(/(\d+)(?::(\d+))?\s*(am|pm)/g)];
  if (all.length === 0) return null;
  const start = parseTimeToken(all[0]);
  const end = all.length > 1 ? parseTimeToken(all[1]) : null;
  return { start, end };
}

function formatTime(hour24) {
  const total = Math.round((((hour24 % 24) + 24) % 24) * 60);
  const h = Math.floor(total / 60);
  const m = total % 60;
  const period = h >= 12 ? 'PM' : 'AM';
  const displayH = h % 12 || 12;
  const displayM = m.toString().padStart(2, '0');
  return `${displayH}:${displayM} ${period}`;
}

function parseMealHour(timing) {
  const m = timing.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!m) return 99;
  let h = Number(m[1]);
  const min = Number(m[2]);
  const p = m[3].toLowerCase();
    if (p === 'pm' && h !== 12) h += 12; 
    if (p === 'am' && h === 12) h = 0; 
  return h + min / 60;
}

function parseWorkoutTimes(workoutTime) {
  if (!workoutTime || typeof workoutTime !== 'string') {
    return { startHour: 18, endHour: 19 };
  }

  const matches = [...workoutTime.toLowerCase().matchAll(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/g)];
  if (!matches.length) {
    return { startHour: 18, endHour: 19 };
  }

  const startHour = parseTimeToken(matches[0]);
  const endHour = matches[1] ? parseTimeToken(matches[1]) : startHour + 1;
  return { startHour, endHour };
}

function ProfilePage({ userProfile, setUserProfile }) {
  const [saveMessage, setSaveMessage] = useState('');

  const handleInputChange = (field, value) => {
    const updated = { ...userProfile, [field]: value };
    setUserProfile(updated);
    Storage.saveProfile(updated);
  };

  const handleSaveProfile = () => {
    Storage.saveProfile(userProfile);
    setSaveMessage('Profile details saved successfully.');
    window.setTimeout(() => setSaveMessage(''), 2200);
  };

  const targetSuggestion = useMemo(() => {
    const currentWeight = Number(userProfile.currentWeight);
    const targetWeight = Number(userProfile.targetWeight);
    const timelineMonths = Number(userProfile.timeline);
    const age = Number(userProfile.age);
    const heightCm = Number(userProfile.height);
    const goal = userProfile.goal;
    const workoutLevel = userProfile.workoutLevel;
    const dietType = userProfile.dietType;

    const hasBaseInputs = Number.isFinite(currentWeight) && Number.isFinite(targetWeight) && Number.isFinite(timelineMonths) && timelineMonths > 0;
    const delta = hasBaseInputs ? targetWeight - currentWeight : 0;
    const weeks = hasBaseInputs ? timelineMonths * 4 : 0;
    const weeklyChange = weeks > 0 ? Math.abs(delta) / weeks : 0;
    const bmi = heightCm > 0 && Number.isFinite(currentWeight) ? currentWeight / ((heightCm / 100) ** 2) : null;
    const isMuscleGoal = ['Lean Muscle Gain', 'Strength Building', 'Body Recomposition'].includes(goal);
    const isLossGoal = goal === 'Weight Loss';
    const isMaintainGoal = goal === 'Maintain Weight';

    if (!goal) {
      return {
        type: 'info',
        title: 'Pick a goal first',
        message: 'Choose a target goal so I can guide you more precisely.',
        bullets: ['Weight loss needs a calorie deficit.', 'Muscle gain needs a small surplus and enough protein.', 'Maintenance works best when your target stays close to your current weight.']
      };
    }

    if (!hasBaseInputs) {
      return {
        type: 'info',
        title: 'Add your current and target weight',
        message: 'Once those are set, I can judge whether your target pace is realistic and suggest the best next step.',
        bullets: ['Use your current weight and target weight first.', 'Add a timeline in months for a better pace estimate.', 'Your goal and activity level also help me personalize the advice.']
      };
    }

    if (isLossGoal && targetWeight >= currentWeight) {
      return {
        type: 'warning',
        title: 'Your loss target looks inconsistent',
        message: 'A weight-loss goal usually needs a target that is lower than your current weight. I recommend a realistic pace instead of an extreme drop.',
        bullets: ['Aim for about 0.25–0.75 kg per week.', 'Use a steady calorie deficit rather than crash dieting.', 'Keep strength training so you preserve muscle while losing fat.']
      };
    }

    if (isMuscleGoal && targetWeight <= currentWeight) {
      return {
        type: 'info',
        title: 'Muscle-building targets are better when slightly higher',
        message: 'For muscle gain, a small increase is usually more practical than staying flat or dropping weight.',
        bullets: ['Aim for a slow gain of about 0.25–0.5 kg per week.', 'Prioritize protein and recovery.', 'Start with compound lifts and consistent training.']
      };
    }

    if (isMaintainGoal && Math.abs(delta) > 1) {
      return {
        type: 'info',
        title: 'Maintenance targets are usually close to your current weight',
        message: 'If you want to maintain, your target should usually stay near your current weight unless you want a minor adjustment.',
        bullets: ['Keep calories and activity steady.', 'Track your weight for 2–3 weeks before changing anything.', 'Use small changes instead of big swings.']
      };
    }

    if (isLossGoal && weeklyChange > 0.75) {
      return {
        type: 'warning',
        title: 'This pace may be too aggressive',
        message: `Losing ${Math.abs(delta).toFixed(1)} kg over ${timelineMonths} month(s) is about ${weeklyChange.toFixed(2)} kg per week. That is often too fast for long-term progress.`,
        bullets: ['Try a safer pace of 0.25–0.75 kg per week.', 'Focus on consistency over speed.', 'Add protein and sleep to protect muscle.']
      };
    }

    if (isMuscleGoal && weeklyChange > 0.5) {
      return {
        type: 'warning',
        title: 'This gain pace may be too fast',
        message: `Gaining ${Math.abs(delta).toFixed(1)} kg over ${timelineMonths} month(s) is about ${weeklyChange.toFixed(2)} kg per week. That pace can be hard to sustain.`,
        bullets: ['Aim for a modest surplus instead of overeating.', 'Keep protein high and training consistent.', 'Increase calories gradually if needed.']
      };
    }

    const bullets = [];
    if (age && age < 18) {
      bullets.push('Because you are under 18, use a coach or medical guidance for big changes.');
    }
    if (bmi && bmi > 30 && isLossGoal) {
      bullets.push('Your BMI is high, so a slower and more sustainable fat-loss approach is smarter.');
    }
    if (bmi && bmi < 18.5 && isMuscleGoal) {
      bullets.push('Your BMI is low, so recovery and a small surplus matter more than aggressive eating.');
    }
    if (workoutLevel === 'Beginner') {
      bullets.push('Since you are a beginner, consistency and form beat intensity.');
    }
    if (workoutLevel === 'Advanced') {
      bullets.push('As an advanced user, progressive overload and recovery will matter most.');
    }
    if (dietType === 'Vegetarian' || dietType === 'Vegan') {
      bullets.push('Keep protein high with tofu, soy chunks, paneer, lentils, eggs, or a suitable supplement.');
    }

    return {
      type: 'success',
      title: 'Smart profile suggestion',
      message: 'Your target looks generally reasonable. Keep the pace steady and focus on consistency, nutrition, and recovery.',
      bullets: bullets.length > 0 ? bullets : ['Stay consistent for 2–3 weeks before changing the plan.', 'Track weight, energy, and workout performance weekly.']
    };
  }, [userProfile.currentWeight, userProfile.targetWeight, userProfile.timeline, userProfile.goal, userProfile.workoutLevel, userProfile.dietType, userProfile.age, userProfile.height]);

  return (
    <div className="max-w-4xl mx-auto px-4 py-8">
      <h2 className="text-3xl font-bold mb-8">Your Fitness Profile</h2>
      <p className="text-zinc-300 mb-6">Fill in your details to generate a personalized transformation plan.</p>

      <div className="rounded-xl border border-zinc-700 bg-zinc-800/50 p-8">
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label className="block text-sm font-semibold text-zinc-400 mb-2">Age</label>
            <input
              type="number"
              value={userProfile.age}
              onChange={(e) => handleInputChange('age', e.target.value)}
              className="w-full rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-2 text-white"
            />
          </div>

          <div>
            <label className="block text-sm font-semibold text-zinc-400 mb-2">Current Weight (kg)</label>
            <input
              type="number"
              value={userProfile.currentWeight}
              onChange={(e) => handleInputChange('currentWeight', e.target.value)}
              className="w-full rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-2 text-white"
            />
          </div>

          <div>
            <label className="block text-sm font-semibold text-zinc-400 mb-2">Target Weight (kg)</label>
            <input
              type="number"
              value={userProfile.targetWeight}
              onChange={(e) => handleInputChange('targetWeight', e.target.value)}
              className="w-full rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-2 text-white"
            />
          </div>

          <div>
            <label className="block text-sm font-semibold text-zinc-400 mb-2">Height (cm)</label>
            <input
              type="number"
              value={userProfile.height}
              onChange={(e) => handleInputChange('height', e.target.value)}
              className="w-full rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-2 text-white"
            />
          </div>

          <div>

              value={userProfile.dietType}
              onChange={(e) => handleInputChange('dietType', e.target.value)}
              className="w-full rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-2 text-white"
            >
              <option value="">Select Diet</option>
              <option>Vegetarian</option>
              <option>Omnivore (Mixed)</option>
              <option>Non Vegetarian</option>
              <option>Vegan</option>
            </select>
          </div>

          <div>
            <label className="block text-sm font-semibold text-zinc-400 mb-2">Workout Time</label>
            <input
              type="text"
              value={userProfile.workoutTime}
              onChange={(e) => handleInputChange('workoutTime', e.target.value)}
              placeholder="e.g. 6 AM or 6 PM"
              className="w-full rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-2 text-white"
            />
          </div>

          <div>
            <label className="block text-sm font-semibold text-zinc-400 mb-2">Timeline (Months)</label>
            <input
              type="number"
              min="1"
              value={userProfile.timeline}
              onChange={(e) => handleInputChange('timeline', e.target.value)}
              className="w-full rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-2 text-white"
            />
          </div>

          <div>
            <label className="block text-sm font-semibold text-zinc-400 mb-2">Monthly Diet Budget (₹)</label>
            <input
              type="number"
              min="0"
              value={userProfile.monthlyBudget}
              onChange={(e) => handleInputChange('monthlyBudget', e.target.value)}
              className="w-full rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-2 text-white"
            />
          </div>
        </div>
      </div>

      <div className="mt-8 space-y-3">
        {targetSuggestion && (
          <div className={`rounded-xl border px-4 py-3 ${targetSuggestion.type === 'warning' ? 'border-orange-500/40 bg-orange-500/10' : targetSuggestion.type === 'info' ? 'border-cyan-500/40 bg-cyan-500/10' : 'border-emerald-500/40 bg-emerald-500/10'}`}>
            <div className="flex items-start justify-between gap-3">
              <div>
                <p className={`font-semibold ${targetSuggestion.type === 'warning' ? 'text-orange-300' : targetSuggestion.type === 'info' ? 'text-cyan-300' : 'text-emerald-300'}`}>{targetSuggestion.title}</p>
                <p className="mt-1 text-sm text-zinc-300">{targetSuggestion.message}</p>
                {targetSuggestion.bullets?.length > 0 && (
                  <ul className="mt-2 ml-4 list-disc space-y-1 text-sm text-zinc-300">
                    {targetSuggestion.bullets.map((bullet, index) => (
                      <li key={index}>{bullet}</li>
                    ))}
                  </ul>
                )}
              </div>
              <div className="text-xl">{targetSuggestion.type === 'warning' ? '⚠️' : targetSuggestion.type === 'info' ? '💡' : '✅'}</div>
            </div>
          </div>
        )}

        <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <button
            type="button"
            onClick={handleSaveProfile}
            className="rounded-lg bg-orange-500 px-5 py-2.5 text-sm font-bold text-black transition hover:bg-orange-400"
          >
            💾 Save Profile Details
          </button>
        </div>
      </div>
    </div>
  );
}

function WorkoutsPage({ userProfile }) {
  const [selectedDay, setSelectedDay] = useState(0);
  const [selectedMonth, setSelectedMonth] = useState(1);
  const selectedWorkoutLevel = userProfile.workoutLevel || 'Intermediate';
  const monthCount = Math.max(1, Number(userProfile.timeline) || 6);

  const getVariationExerciseList = (exercises, monthNumber, level) => {
    if (!exercises || exercises.length === 0) return [];
    const base = [...exercises];
    const cycle = Math.floor((monthNumber - 1) / 3);
    const rotateBy = cycle % 3;

    const rotated = rotateBy === 0
      ? base
      : rotateBy === 1
        ? [...base.slice(1), base[0]]
        : [...base.slice(2), ...base.slice(0, 2)];

    const suffix = level === 'Beginner' ? ' Tempo' : level === 'Intermediate' ? ' Progression' : ' Advanced';
    return rotated.map((exercise, idx) => {
      if (idx === 0 && rotateBy > 0) return `${exercise}${suffix}`;
      return exercise;
    });
  };

  const getMonthWorkoutData = (monthNumber) => {
    const cycleIndex = Math.floor((monthNumber - 1) / 3);
    const phaseLabel = cycleIndex === 0 ? 'Foundation' : cycleIndex === 1 ? 'Progression' : 'Peak';
    const repRangeMap = {
      Beginner: ['10–12 reps', '8–10 reps', '8–10 reps'],
      Intermediate: ['8–10 reps', '6–8 reps', '6–8 reps'],
      Advanced: ['6–8 reps', '5–7 reps', '4–6 reps'],
    };
    const intensityMap = {
      Beginner: ['Technique + volume', 'Controlled strength', 'Power with control'],
      Intermediate: ['Strength + control', 'Strength + hypertrophy', 'Power + overload'],
      Advanced: ['Power + overload', 'Maximal strength', 'Peak performance'],
    };

    const repRange = repRangeMap[selectedWorkoutLevel]?.[cycleIndex] || repRangeMap.Intermediate[cycleIndex];
    const intensity = intensityMap[selectedWorkoutLevel]?.[cycleIndex] || intensityMap.Intermediate[cycleIndex];
    const baseHome = exerciseDatabase[selectedWorkoutLevel]?.home || [];
    const baseGym = exerciseDatabase[selectedWorkoutLevel]?.gym || [];

    return {
      cycleIndex,
      phaseLabel,
      repRange,
      intensity,
      home: baseHome.map((group) => ({ ...group, exercises: getVariationExerciseList(group.exercises, monthNumber, selectedWorkoutLevel) })),
      gym: baseGym.map((group) => ({ ...group, exercises: getVariationExerciseList(group.exercises, monthNumber, selectedWorkoutLevel) }))
    };
  };

  React.useEffect(() => {
    setSelectedMonth((prev) => Math.min(prev, monthCount));
  }, [monthCount]);

  const monthSchedule = useMemo(() => {
    return Array.from({ length: monthCount }, (_, idx) => {
      const monthNumber = idx + 1;
      const phaseIndex = Math.floor((monthNumber - 1) / 3);
      const phaseLabel = phaseIndex === 0 ? 'Foundation' : phaseIndex === 1 ? 'Progression' : 'Peak';
      return {
        monthNumber,
        phaseLabel,
        focus: phaseIndex === 0 ? 'Start with form and consistency' : phaseIndex === 1 ? 'Increase intensity and control' : 'Push harder with overload'
      };
    });
  }, [monthCount]);

  const selectedMonthWorkout = useMemo(() => getMonthWorkoutData(selectedMonth), [selectedMonth, selectedWorkoutLevel]);

  const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const routineTemplates = {
    Beginner: {
      plan: ['Chest + Triceps', 'Back + Biceps', 'Legs + Core', 'Shoulders + Core', 'Full Body', 'Cardio + Arms', 'Rest and Recovery Time'],
      targets: [
        ['Chest', 'Triceps'],
        ['Back', 'Biceps'],
        ['Legs', 'Core'],
        ['Shoulders', 'Core'],
        ['Chest', 'Back', 'Legs'],
        ['Biceps', 'Triceps', 'Shoulders'],
        [],
      ],
    },
    Intermediate: {
      plan: ['Push + Triceps', 'Pull + Biceps', 'Lower Body', 'Shoulders + Abs', 'Upper + Lower', 'Arms + Cardio', 'Rest and Recovery Time'],
      targets: [
        ['Chest', 'Triceps', 'Shoulders'],
        ['Back', 'Biceps', 'Shoulders'],
        ['Legs', 'Core'],
        ['Shoulders', 'Core'],
        ['Chest', 'Back', 'Legs'],
        ['Biceps', 'Triceps', 'Shoulders'],
        [],
      ],
    },
    Advanced: {
      plan: ['Upper Power', 'Lower Strength', 'Push + Pull', 'Legs + Core', 'Power Circuit', 'Arms + Shoulders', 'Rest and Recovery Time'],
      targets: [
        ['Chest', 'Triceps', 'Shoulders'],
        ['Legs', 'Core'],
        ['Chest', 'Back', 'Shoulders', 'Triceps', 'Biceps'],
        ['Legs', 'Core', 'Shoulders'],
        ['Chest', 'Back', 'Legs', 'Shoulders'],
        ['Biceps', 'Triceps', 'Shoulders'],
        [],
      ],
    },
  };

  const selectedRoutine = routineTemplates[selectedWorkoutLevel] || routineTemplates.Intermediate;
  const workoutPlan = selectedRoutine.plan;
  const dayLabels = selectedRoutine.plan;
  const groupTargets = selectedRoutine.targets;

  const selectedTargets = groupTargets[selectedDay] || [];
  const matchesTarget = (muscleName) => selectedTargets.some((target) => {
    const targetText = String(target || '').toLowerCase();
    const muscleText = String(muscleName || '').toLowerCase();
    return targetText === muscleText || targetText.includes(muscleText) || muscleText.includes(targetText);
  });
  const homeHighlights = selectedMonthWorkout.home.filter((muscle) => matchesTarget(muscle.muscle));
  const gymHighlights = selectedMonthWorkout.gym.filter((muscle) => matchesTarget(muscle.muscle));

  const buildWorkoutCard = (title, icon, highlights, themeColor, repRange, phaseLabel) => (
    <div className="rounded-3xl border border-zinc-700 bg-zinc-900/70 shadow-xl shadow-black/20 overflow-hidden">
      <div className="flex flex-col gap-4 p-6 sm:p-8 bg-zinc-950/90 border-b border-zinc-800">
        <div className="flex items-start justify-between gap-4">
          <div>
            <p className="text-sm uppercase tracking-[0.25em] text-zinc-500">{title}</p>
            <h3 className="mt-2 text-2xl font-bold text-white">{icon} {title}</h3>
          </div>
          <span className={`rounded-full px-4 py-1 text-sm font-semibold ${themeColor} bg-white/5 border border-white/10`}>{selectedWorkoutLevel}</span>
        </div>

        <div className="flex flex-wrap gap-3">
          <span className="rounded-full bg-zinc-800 px-3 py-2 text-xs uppercase tracking-wide text-zinc-300">4 Sets</span>
          <span className="rounded-full bg-zinc-800 px-3 py-2 text-xs uppercase tracking-wide text-zinc-300">{repRange}</span>
          <span className="rounded-full bg-zinc-800 px-3 py-2 text-xs uppercase tracking-wide text-zinc-300">Rest 60s</span>
        </div>
        <p className="text-sm text-zinc-400">{phaseLabel} phase • {selectedMonthWorkout.intensity}</p>
      </div>

      <div className="grid gap-4 p-6 sm:p-8 bg-zinc-900">
        {highlights.length > 0 ? (
          highlights.map((group, idx) => (
            <div key={idx} className="rounded-3xl border border-zinc-800 bg-zinc-950/70 p-5">
              <div className="flex items-center justify-between gap-3 mb-4">
                <h4 className="text-lg font-semibold text-white">{group.muscle}</h4>
                <span className={`text-xs font-semibold ${group.color}`}>{selectedDay === 6 ? 'Recovery' : 'Focus'}</span>
              </div>
              <div className="space-y-3">
                {group.exercises.slice(0, 3).map((exercise, exIdx) => (
                  <div key={exIdx} className="flex items-center justify-between gap-3 rounded-2xl bg-zinc-900 px-4 py-3 border border-zinc-800">
                    <p className="text-sm text-zinc-300">{exIdx + 1}. {exercise}</p>
                    <span className="rounded-full bg-zinc-800 px-3 py-1 text-[11px] uppercase tracking-[0.18em] text-zinc-400">4×{repRange}</span>
                  </div>
                ))}
              </div>
            </div>
          ))
        ) : (
          <div className="rounded-3xl border border-zinc-800 bg-zinc-950/70 p-8 text-zinc-300">
            <p className="text-lg font-semibold text-white mb-3">Rest & Recovery</p>
            <p className="text-sm leading-6">Take it easy today. Focus on mobility, stretching, hydration, and a light walk to help your body recover.</p>
          </div>
        )}
      </div>
    </div>
  );

  return (
    <div className="max-w-7xl mx-auto px-4 py-8">
      <div className="flex flex-col gap-4 md:flex-row md:items-center md:justify-between mb-8">
        <div>
          <p className="text-sm uppercase tracking-[0.3em] text-zinc-500 mb-2">Month-by-month workout progression</p>
          <h2 className="text-3xl font-bold text-white">Workout Plans</h2>
        </div>
      </div>

      {!selectedWorkoutLevel ? (
        <div className="p-8 rounded-3xl bg-yellow-500/10 border border-yellow-500/30">
          <p className="text-yellow-300">⚠️ Please select a Workout Level in your profile to see personalized exercises.</p>
        </div>
      ) : (
        <>
          <div className="mb-8 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
            {monthSchedule.map((month) => (
              <button
                key={month.monthNumber}
                onClick={() => setSelectedMonth(month.monthNumber)}
                className={`rounded-3xl border p-4 text-left transition-all ${
                  selectedMonth === month.monthNumber
                    ? 'border-orange-500 bg-orange-500/10 text-orange-200'
                    : 'border-zinc-700 bg-zinc-900/70 text-zinc-300 hover:border-zinc-500'
                }`}
              >
                <p className="text-xs uppercase tracking-[0.25em] text-zinc-500">Month {month.monthNumber}</p>
                <p className="mt-2 text-lg font-semibold text-white">{month.phaseLabel} Phase</p>
                <p className="mt-2 text-sm text-zinc-400">{month.focus}</p>
              </button>
            ))}
          </div>

          <div className="mb-6 rounded-3xl border border-zinc-700 bg-zinc-900/70 p-6 sm:p-8">
            <div className="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
              <div>
                <p className="text-sm uppercase tracking-[0.25em] text-zinc-500">Selected month</p>
                <p className="mt-2 text-2xl font-bold text-white">Month {selectedMonth} • {selectedMonthWorkout.phaseLabel} Phase</p>
                <p className="mt-2 text-sm text-zinc-400">{selectedMonthWorkout.intensity} with {selectedMonthWorkout.repRange} per exercise.</p>
              </div>
              <div className="rounded-3xl bg-zinc-950/80 border border-zinc-800 px-5 py-3 text-sm text-zinc-400">
                {selectedWorkoutLevel} level • 3-month progression cycle
              </div>
            </div>
          </div>

          <div className="overflow-x-auto pb-2 mb-6">
            <div className="inline-flex items-center gap-3">
              {days.map((day, idx) => (
                <button
                  key={day}
                  onClick={() => setSelectedDay(idx)}
                  className={`min-w-[120px] rounded-3xl border px-5 py-4 text-left transition-all ${
                    selectedDay === idx
                      ? 'bg-orange-500 text-zinc-950 shadow-[0_12px_30px_-18px_rgba(251,146,60,0.9)] border-orange-500'
                      : 'bg-zinc-900 border-zinc-700 text-zinc-300 hover:border-zinc-500 hover:text-white'
                  }`}
                >
                  <p className="text-sm uppercase tracking-[0.25em]">{day}</p>
                  <p className="mt-2 text-sm text-zinc-300">{workoutPlan[idx]}</p>
                </button>
              ))}
            </div>
          </div>

          <div className="mb-8 rounded-3xl border border-zinc-700 bg-zinc-900/70 p-6 sm:p-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <p className="text-xl font-semibold text-white">{days[selectedDay]}</p>
              <p className="mt-2 text-2xl font-bold text-orange-400">{dayLabels[selectedDay]}</p>
            </div>
            <div className="rounded-3xl bg-zinc-950/80 border border-zinc-800 px-5 py-3 text-sm text-zinc-400">
              Day {selectedDay + 1} / 7
            </div>
          </div>

          {selectedDay === 6 ? (
            <div className="rounded-3xl border border-zinc-700 bg-zinc-950/70 p-10 text-center">
              <p className="text-2xl font-semibold text-white mb-4">Rest & Recovery Time</p>
              <p className="text-sm leading-6 text-zinc-400">Take today to recover, hydrate, stretch, and recharge so you can return stronger tomorrow.</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
              {buildWorkoutCard('Home Workout', '🏠', homeHighlights, 'text-emerald-300', selectedMonthWorkout.repRange, selectedMonthWorkout.phaseLabel)}
              {buildWorkoutCard('Gym Workout', '🏋️', gymHighlights, 'text-sky-300', selectedMonthWorkout.repRange, selectedMonthWorkout.phaseLabel)}
            </div>
          )}
        </>
      )}
    </div>
  );
}

const FIXED_QTY = new Set(['Black Coffee', 'Green Tea', 'Honey', 'Ghee', 'Butter', 'Olive Oil']);

function scaleFood(food, factor) {
  if (FIXED_QTY.has(food.name) || Math.abs(factor - 1) < 0.02) return food;

  const scaledCal = Math.round(food.cal * factor);
  const scaledPro = Math.round(food.pro * factor);
  const scaledCarbs = Math.round((food.carbs || 0) * factor);
  const scaledFat = Math.round((food.fat || 0) * factor);
  const scaledFiber = Math.round((food.fiber || 0) * factor);

  const gMatch = (food.qty || '').toString().match(/^(\d+)g$/);
  if (gMatch) {
    const scaled = Math.max(5, Math.round(Number(gMatch[1]) * factor / 5) * 5);
    return {
      name: food.name,
      qty: `${scaled}g`,
      cal: scaledCal,
      pro: scaledPro,
      carbs: scaledCarbs,
      fat: scaledFat,
      fiber: scaledFiber,
    };
  }

  const mlMatch = (food.qty || '').toString().match(/^(\d+)ml$/);
  if (mlMatch) {
    const scaled = Math.max(25, Math.round(Number(mlMatch[1]) * factor / 25) * 25);
    return {
      name: food.name,
      qty: `${scaled}ml`,
      cal: scaledCal,
      pro: scaledPro,
      carbs: scaledCarbs,
      fat: scaledFat,
      fiber: scaledFiber,
    };
  }

  const countMatch = (food.qty || '').toString().match(/^(\d+)\s+(.+)$/);
  if (countMatch) {
    const base = Number(countMatch[1]);
    const unit = countMatch[2];
    const scaled = Math.max(1, Math.round(base * factor));
    const realFactor = scaled / base;
    return {
      name: food.name,
      qty: `${scaled} ${unit}`,
      cal: Math.round(food.cal * realFactor),
      pro: Math.round(food.pro * realFactor),
      carbs: Math.round((food.carbs || 0) * realFactor),
      fat: Math.round((food.fat || 0) * realFactor),
      fiber: Math.round((food.fiber || 0) * realFactor),
    };
  }

  return {
    name: food.name,
    qty: food.qty,
    cal: scaledCal,
    pro: scaledPro,
    carbs: scaledCarbs,
    fat: scaledFat,
    fiber: scaledFiber,
  };
}

function compose(items) {
  const calories = items.reduce((s, i) => s + (i.cal || 0), 0);
  const protein = Math.round(items.reduce((s, i) => s + (i.pro || 0), 0));
  const carbs = Math.round(items.reduce((s, i) => s + (i.carbs || 0), 0));
  const fat = Math.round(items.reduce((s, i) => s + (i.fat || 0), 0));
  const fiber = Math.round(items.reduce((s, i) => s + (i.fiber || 0), 0));

  return {
    meal: items.map((i) => i.name).join(' + '),
    quantity: items.map((i) => i.qty).join(' + '),
    calories,
    protein,
    carbs,
    fat,
    fiber,
    nutrition: `${calories} kcal | ${protein}g Protein | ${carbs}g Carbs | ${fat}g Fat | ${fiber}g Fiber`,
  };
}

// Delegates to external diet planner if available (loaded from dietMeals.js)
function getDietTargets({ currentWeight, targetWeight, timelineMonths, goal, baseCalories, baseProtein, calorieTarget }) {
  const currentKg = Number(currentWeight) || 0;
  const targetKg = Number(targetWeight) || currentKg;
  const months = Math.max(1, Number(timelineMonths) || 1);
  const goalText = String(goal || '').toLowerCase();
  const weightDelta = currentKg > 0 ? targetKg - currentKg : 0;
  const maintenance = currentKg > 0 ? Math.max(1800, Math.round(currentKg * 30)) : Number(baseCalories) || 2200;
  const explicitTarget = Number(calorieTarget) || Number(baseCalories) || 0;

  let adjustedCalories = Number(baseCalories) || maintenance;
  let adjustedProtein = Number(baseProtein) || 150;

  if (explicitTarget > 0) {
    adjustedCalories = explicitTarget;
    adjustedProtein = Math.max(Number(baseProtein) || 110, Math.round((currentKg || 60) * (goalText.includes('gain') || goalText.includes('muscle') ? 2.1 : 1.8)));
    return {
      calories: Math.round(adjustedCalories),
      protein: Math.round(adjustedProtein),
    };
  }

  if (currentKg > 0) {
    if (goalText.includes('loss') || goalText.includes('cut') || goalText.includes('fat')) {
      const deficit = Math.min(700, Math.max(250, Math.abs(weightDelta) * 180 / months));
      adjustedCalories = Math.max(1400, maintenance - deficit);
      adjustedProtein = Math.max(110, Math.round(currentKg * 1.8));
    } else if (goalText.includes('gain') || goalText.includes('bulk') || goalText.includes('muscle')) {
      const surplus = Math.min(500, Math.max(180, Math.abs(weightDelta) * 150 / months));
      adjustedCalories = maintenance + surplus;
      adjustedProtein = Math.max(120, Math.round(currentKg * 2.1));
    } else {
      adjustedCalories = maintenance;
      adjustedProtein = Math.max(110, Math.round(currentKg * 1.7));
    }
  }

  return {
    calories: Math.round(adjustedCalories),
    protein: Math.round(adjustedProtein),
  };
}

function getDietMeals(dietType, monthlyBudget, selectedMonth, monthCount, calorieTarget, proteinTarget, workoutTime, currentWeight, targetWeight, timelineMonths, goal) {
  if (typeof window.getDietMealsExternal === 'function' && window.getDietMealsExternal !== getDietMeals) {
    return window.getDietMealsExternal(dietType, monthlyBudget, selectedMonth, monthCount, calorieTarget, proteinTarget, workoutTime, currentWeight, targetWeight, timelineMonths, goal);
  }
  if (typeof window.getDietMeals === 'function' && window.getDietMeals !== getDietMeals) {
    return window.getDietMeals(dietType, monthlyBudget, selectedMonth, monthCount, calorieTarget, proteinTarget, workoutTime, currentWeight, targetWeight, timelineMonths, goal);
  }

  const baseCalories = Number(calorieTarget) || 2200;
  const baseProtein = Number(proteinTarget) || 150;
  const adjustedTarget = getDietTargets({ currentWeight, targetWeight, timelineMonths, goal, baseCalories, baseProtein });
  const budget = Number(monthlyBudget) || 0;
  const monthIndex = Math.max(0, Number(selectedMonth) - 1);
  const rangeFactor = 1 + (monthIndex / Math.max(1, Number(monthCount) || 1)) * 0.12;
  const isVegetarian = /vegetarian|vegan/i.test(dietType || '');
  const prefersHighProtein = /high protein|cut|bulk|lean/i.test(dietType || '') || /gain|loss/i.test(String(goal || ''));
  const hasWorkout = Boolean(workoutTime && String(workoutTime).trim());
  const budgetFactor = budget < 2500 ? 0.9 : budget < 5000 ? 1 : 1.12;

  const breakfastBase = isVegetarian
    ? { meal: 'Oats + Paneer + Fruit', quantity: '80g oats + 150g paneer + 1 banana', carbs: 56, fat: 18, fiber: 9 }
    : { meal: 'Oats + Eggs + Fruit', quantity: '80g oats + 3 eggs + 1 banana', carbs: 55, fat: 14, fiber: 9 };

  const lunchBase = isVegetarian
    ? { meal: 'Tofu + Rice + Veg', quantity: '150g tofu + 200g rice + 200g veg', carbs: 68, fat: 17, fiber: 10 }
    : { meal: 'Chicken + Rice + Veg', quantity: '150g chicken + 200g rice + 200g veg', carbs: 70, fat: 15, fiber: 9 };

  const preBase = { meal: hasWorkout ? 'Yogurt + Fruit' : 'Fruit + Nuts', quantity: hasWorkout ? '200g curd + 1 banana' : '1 fruit + 15g nuts', carbs: 32, fat: 4, fiber: 4 };
  const postBase = isVegetarian
    ? { meal: 'Soy Shake + Fruit', quantity: '1 soy shake + 1 fruit', carbs: 28, fat: 4, fiber: 3 }
    : { meal: 'Whey Shake + Fruit', quantity: '1 shake + 1 fruit', carbs: 30, fat: 3, fiber: 3 };
  const snackBase = isVegetarian
    ? { meal: 'Paneer / Soya Chunks', quantity: '150g paneer or 50g soya chunks', carbs: 18, fat: 8, fiber: 2 }
    : { meal: 'Paneer / Yogurt', quantity: '150g paneer or 200g yogurt', carbs: 20, fat: 10, fiber: 2 };
  const dinnerBase = isVegetarian
    ? { meal: 'Dal + Rice + Veg', quantity: '150g dal + 150g rice + 200g veg', carbs: 50, fat: 14, fiber: 11 }
    : { meal: 'Salmon + Rice + Veg', quantity: '150g salmon + 150g rice + 200g veg', carbs: 52, fat: 16, fiber: 10 };

  const factor = Math.min(1.15, Math.max(0.88, rangeFactor * budgetFactor));
  const proteinBoost = prefersHighProtein ? 1.12 : 1;

  const buildMeal = (base, baseProteinValue, baseCalorieShare, includeProtein) => {
    const calories = Math.round(adjustedTarget.calories * baseCalorieShare * factor);
    const proteinValue = Math.max(includeProtein ? 12 : 10, Math.round(adjustedTarget.protein * baseProteinValue * proteinBoost));
    return {
      timing: base.timing || 'Meal',
      meal: base.meal,
      quantity: base.quantity,
      calories,
      protein: proteinValue,
      carbs: Math.round(base.carbs * factor),
      fat: Math.round(base.fat * factor),
      fiber: Math.round(base.fiber * factor),
    };
  };

  const mealSet = [
    { ...breakfastBase, timing: '7:00 AM — Breakfast' },
    { ...lunchBase, timing: '1:00 PM — Lunch' },
    { ...preBase, timing: '4:30 PM — Pre Workout' },
    { ...postBase, timing: '6:30 PM — Post Workout' },
    { ...snackBase, timing: '8:30 PM — Snack' },
    { ...dinnerBase, timing: '9:30 PM — Dinner' },
  ].map((meal, index) => {
    const share = [0.27, 0.31, 0.12, 0.12, 0.10, 0.28][index] || 0.1;
    const proteinFactor = [0.24, 0.3, 0.1, 0.12, 0.1, 0.26][index] || 0.12;
    const includeProtein = index !== 0 || prefersHighProtein;
    return buildMeal(meal, proteinFactor, share, includeProtein);
  });

  const secondHalf = mealSet.map((meal, index) => {
    const tweak = index % 2 === 0 ? 0.97 : 1.03;
    const variedQuantity = meal.quantity
      ? meal.quantity.replace(/(\d+)(g|ml| Banana| eggs| fruits| fruit| slices| roti| cups?)/i, (_, n, unit) => {
          const adjusted = Math.max(1, Math.round(Number(n) * tweak));
          return `${adjusted}${unit}`;
        })
      : meal.quantity;

    return {
      ...meal,
      quantity: variedQuantity,
      calories: Math.max(80, Math.round(meal.calories * (0.94 + (index * 0.01)))),
      protein: Math.max(8, Math.round(meal.protein * (0.96 + (index * 0.005)))),
      carbs: Math.max(8, Math.round(meal.carbs * (0.95 + (index * 0.007)))),
      fat: Math.max(2, Math.round(meal.fat * (0.96 + (index * 0.004)))),
      fiber: Math.max(1, Math.round(meal.fiber * (0.95 + (index * 0.006)))),
    };
  });

  return {
    firstHalf: mealSet,
    secondHalf,
  };
}

// Estimate body composition from BMI/height/age/sex (rough population-level formulas)
function estimatesFromBMI({ weightKg, heightM, age, sex }) {
  // BMI
  const BMI = weightKg / (heightM * heightM);
  // Deurenberg equation for body fat percentage
  const sexNum = (sex === 'male' || sex === 'm') ? 1 : 0;
  const bodyFatPercent = 1.2 * BMI + 0.23 * (Number(age) || 30) - 10.8 * sexNum - 5.4;

  // Boer formula for lean body mass (kg)
  const heightCm = heightM * 100;
  const LBM = sexNum
    ? 0.407 * weightKg + 0.267 * heightCm - 19.2
    : 0.252 * weightKg + 0.473 * heightCm - 48.3;

  // Total body water approximated as 73% of lean mass
  const TBWkg = 0.73 * LBM;

  return {
    BMI: Number(BMI.toFixed(1)),
    bodyFatPercent: Number(bodyFatPercent.toFixed(1)),
    leanBodyMassKg: Number(LBM.toFixed(1)),
    leanBodyMassPercent: Number(((LBM / weightKg) * 100).toFixed(1)),
    totalBodyWaterKg: Number(TBWkg.toFixed(1)),
    totalBodyWaterPercent: Number(((TBWkg / weightKg) * 100).toFixed(1)),
  };
}

function DietPage({ userProfile }) {
  const [selectedMonth, setSelectedMonth] = useState(1);
  const [showModal, setShowModal] = useState(false);
  const [showSecondHalf, setShowSecondHalf] = useState(false);

  const totalMonths = Math.max(1, Number(userProfile.timeline) || months.length);
  const dynamicMonths = useMemo(() => {
    const currentWeight = Number(userProfile.currentWeight) || 0;
    const targetWeight = Number(userProfile.targetWeight) || currentWeight;
    const step = totalMonths > 1 ? (targetWeight - currentWeight) / totalMonths : 0;
    const calculatorTarget = Number(userProfile.calorieTarget) || null;
    const goalText = String(userProfile.goal || '').toLowerCase();

    return Array.from({ length: totalMonths }, (_, index) => {
      const monthNumber = index + 1;
      const startWeight = Number((currentWeight + step * index).toFixed(1));
      const endWeight = Number((currentWeight + step * (index + 1)).toFixed(1));
      const monthBase = months[index % months.length] || months[0];
      const anchorCalories = calculatorTarget || monthBase.calories;
      const weightGap = Math.abs((Number(targetWeight) || Number(currentWeight) || 0) - (Number(currentWeight) || 0));
      const progressRatio = totalMonths > 1 ? index / (totalMonths - 1) : 0;
      const variationWindow = goalText.includes('gain') || goalText.includes('muscle')
        ? Math.max(90, Math.min(260, weightGap * 6))
        : goalText.includes('loss') || goalText.includes('cut') || goalText.includes('fat')
          ? Math.max(100, Math.min(280, weightGap * 7))
          : 0;

      let calories = anchorCalories;
      if (variationWindow > 0) {
        const monthShift = progressRatio * variationWindow;
        calories = goalText.includes('gain') || goalText.includes('muscle')
          ? Math.round(anchorCalories + monthShift)
          : Math.round(anchorCalories - monthShift);
      }

      const proteinBase = calculatorTarget
        ? Math.max(monthBase.protein, Math.round((currentWeight || 60) * (goalText.includes('gain') || goalText.includes('muscle') ? 2.1 : 1.8)))
        : monthBase.protein;
      const proteinGrowth = totalMonths > 1 && variationWindow > 0 ? Math.round((progressRatio * (goalText.includes('gain') || goalText.includes('muscle') ? 8 : 6))) : 0;
      const protein = Math.max(110, proteinBase + proteinGrowth);

      return {
        month: monthNumber,
        startWeight: Number.isFinite(startWeight) ? startWeight : monthBase.startWeight,
        endWeight: Number.isFinite(endWeight) ? endWeight : monthBase.endWeight,
        calories,
        protein,
      };
    });
  }, [totalMonths, userProfile.calorieTarget, userProfile.currentWeight, userProfile.goal, userProfile.targetWeight]);

  const currentMonth = dynamicMonths.find((m) => m.month === selectedMonth) || dynamicMonths[0];
  const monthCount = dynamicMonths.length;

  const dietTargets = useMemo(() => {
    return getDietTargets({
      currentWeight: userProfile.currentWeight,
      targetWeight: userProfile.targetWeight,
      timelineMonths: userProfile.timeline,
      goal: userProfile.goal,
      baseCalories: Number(userProfile.calorieTarget) || currentMonth.calories,
      baseProtein: currentMonth.protein,
      calorieTarget: Number(userProfile.calorieTarget) || null,
    });
  }, [currentMonth.calories, currentMonth.protein, userProfile.calorieTarget, userProfile.currentWeight, userProfile.goal, userProfile.targetWeight, userProfile.timeline]);

  const meals = useMemo(() => {
    const { startHour: workoutStart, endHour: workoutEnd } = parseWorkoutTimes(userProfile.workoutTime);
    const monthlyBudget = Number(userProfile.monthlyBudget) || 0;
    const plan = getDietMeals(
      userProfile.dietType || 'Omnivore (Mixed)',
      monthlyBudget,
      selectedMonth,
      monthCount,
      dietTargets.calories,
      dietTargets.protein,
      userProfile.workoutTime,
      userProfile.currentWeight,
      userProfile.targetWeight,
      userProfile.timeline,
      userProfile.goal
    );

    const planFirst = plan && plan.firstHalf ? plan.firstHalf : Array.isArray(plan) ? plan : [];
    const planSecond = plan && plan.secondHalf ? plan.secondHalf : planFirst;

    const formatTimeStr = (hour) => {
      const h = Math.floor(hour);
      const m = Math.round((hour - h) * 60);
      const period = h >= 12 ? 'PM' : 'AM';
      const displayH = h % 12 || 12;
      return `${displayH}:${m.toString().padStart(2, '0')} ${period}`;
    };

    const buildMealsFromPlan = (mealPlanArray) => {
      const safeMeals = Array.isArray(mealPlanArray) && mealPlanArray.length ? mealPlanArray : [
        { timing: '7:00 AM — Breakfast', meal: 'Oats + Eggs + Fruit', quantity: '80g oats + 3 eggs + 1 banana', calories: 420, protein: 28, carbs: 55, fat: 14, fiber: 9 },
        { timing: '1:00 PM — Lunch', meal: 'Chicken + Rice + Veg', quantity: '150g chicken + 200g rice + 200g veg', calories: 610, protein: 42, carbs: 70, fat: 15, fiber: 9 },
        { timing: '4:30 PM — Pre Workout', meal: 'Yogurt + Fruit', quantity: '200g curd + 1 banana', calories: 220, protein: 14, carbs: 32, fat: 3, fiber: 4 },
        { timing: '6:30 PM — Post Workout', meal: 'Whey Shake + Fruit', quantity: '1 shake + 1 fruit', calories: 220, protein: 25, carbs: 30, fat: 3, fiber: 3 },
        { timing: '8:30 PM — Snack', meal: 'Paneer / Yogurt', quantity: '150g paneer or 200g yogurt', calories: 260, protein: 22, carbs: 20, fat: 10, fiber: 2 },
        { timing: '9:30 PM — Dinner', meal: 'Fish + Rice + Veg', quantity: '150g fish + 150g rice + 200g veg', calories: 560, protein: 38, carbs: 52, fat: 16, fiber: 10 },
      ];

      const mealArray = [];
      const pushMeal = (hour, entry) => {
        if (!entry) return;
        const timeValue = Number.isFinite(hour) ? Math.round(hour * 60) : 0;
        mealArray.push({
          time: formatTimeStr(hour),
          timeValue,
          title: (entry.timing || '').split('—').pop().trim() || entry.meal || 'Meal',
          meal: entry.meal,
          quantity: entry.quantity,
          calories: Number(entry.calories || 0),
          protein: Number(entry.protein || 0),
          carbs: Number(entry.carbs || 0),
          fat: Number(entry.fat || 0),
          fiber: Number(entry.fiber || 0),
        });
      };

      const hasWorkout = Boolean(userProfile.workoutTime);
      const preWorkoutHour = hasWorkout ? Math.max(5.5, workoutStart - 0.5) : null;
      const postWorkoutHour = hasWorkout ? workoutEnd + 0.5 : null;
      const breakfastHour = hasWorkout && workoutEnd <= 9
        ? Math.max(7, postWorkoutHour + 0.75)
        : 7;
      const lunchHour = hasWorkout && workoutEnd >= 11.5 && workoutEnd <= 14.5
        ? workoutEnd + 1
        : 13;
      let snackHour = 16.5;
      if (hasWorkout) {
        if (workoutStart >= 15) {
          snackHour = Math.min(
            Math.max(lunchHour + 2, workoutStart - 0.75),
            workoutStart - 0.25
          );
        } else {
          snackHour = Math.max(lunchHour + 2.5, 16.5);
        }
        if (snackHour >= preWorkoutHour) {
          snackHour = Math.max(lunchHour + 2, preWorkoutHour - 0.75);
        }
        if (snackHour <= lunchHour) {
          snackHour = lunchHour + 1.5;
        }
      }

      pushMeal(breakfastHour, safeMeals[0]);

      if (hasWorkout) {
        pushMeal(preWorkoutHour, safeMeals[2]);
        pushMeal(postWorkoutHour, safeMeals[3]);
      }

      pushMeal(lunchHour, safeMeals[1]);
      pushMeal(snackHour, safeMeals[4]);
      pushMeal(20, safeMeals[5]);

      mealArray.sort((a, b) => a.timeValue - b.timeValue);
      return mealArray;
    };

    const mealsFirst = buildMealsFromPlan(planFirst);
    const mealsSecond = buildMealsFromPlan(planSecond);
    return { first: mealsFirst, second: mealsSecond };
  }, [currentMonth, monthCount, selectedMonth, userProfile.dietType, userProfile.monthlyBudget, userProfile.workoutTime]);

  return (
    <div className="max-w-7xl mx-auto px-4 py-8">
      {/* Month Diet Plan Modal */}
      {showModal && (
        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-zinc-900 rounded-2xl border border-zinc-700 p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-start mb-6">
              <div>
                <h3 className="text-2xl font-bold text-white mb-2">Month {selectedMonth} of {monthCount} Diet Plan</h3>
                <p className="text-zinc-400 mb-1">Goal: {currentMonth?.startWeight ?? 0} → {currentMonth?.endWeight ?? 0} KG</p>
                {userProfile.workoutTime && (
                  <p className="text-sm text-orange-300">⏰ Workout Time: {userProfile.workoutTime}</p>
                )}
              </div>

function TrendLineChart({ data, color, label, unit }) {
  if (!data || data.length < 2) return null;
  const width = 460;
  const height = 250;
  const padding = 30;
  const values = data.map(item => item.value);
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;

  const points = data.map((item, index) => {
    const x = padding + (index / (data.length - 1)) * (width - padding * 2);
    const y = height - padding - ((item.value - min) / range) * (height - padding * 2);
    return { x, y, label: item.label, value: item.value };
  });

  const linePath = points.map((point, index) => `${index === 0 ? 'M' : 'L'} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L ${points[points.length - 1].x.toFixed(1)} ${height - padding} L ${points[0].x.toFixed(1)} ${height - padding} Z`;
  const gridLines = [0.2, 0.4, 0.6, 0.8].map(step => height - padding - step * (height - padding * 2));

  return (
    <div className="mt-4">
      <div className="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <p className="text-sm font-semibold text-white">{label}</p>
          <p className="text-xs text-zinc-400">Clean trend view with steady progress insight</p>
        </div>
        <div className="flex items-center gap-2 rounded-full border border-zinc-700 bg-zinc-900/90 px-3 py-1 text-xs text-zinc-300 shadow-sm shadow-black/20">
          <span className="h-2.5 w-2.5 rounded-full" style={{ backgroundColor: color }}></span>
          Latest: {data[data.length - 1].value}{unit}
        </div>
      </div>

      <svg viewBox={`0 0 ${width} ${height}`} className="h-64 w-full rounded-2xl border border-zinc-800 bg-gradient-to-br from-zinc-950 via-zinc-900 to-zinc-950 p-2 shadow-inner shadow-black/20">
        <defs>
          <linearGradient id={`trendFill-${label}`} x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stopColor={color} stopOpacity="0.34" />
            <stop offset="100%" stopColor={color} stopOpacity="0.03" />
          </linearGradient>
        </defs>

        {gridLines.map((lineY, idx) => (
          <line key={idx} x1={padding} y1={lineY} x2={width - padding} y2={lineY} stroke="#3f3f46" strokeDasharray="4 4" strokeOpacity="0.7" />
        ))}
        <line x1={padding} y1={height - padding} x2={width - padding} y2={height - padding} stroke="#52525b" strokeWidth="1" />
        <line x1={padding} y1={padding} x2={padding} y2={height - padding} stroke="#52525b" strokeWidth="1" />
        <path d={areaPath} fill={`url(#trendFill-${label})`} />
        <path d={linePath} fill="none" stroke={color} strokeWidth="3.2" strokeLinecap="round" />
        {points.map((point, index) => (
          <g key={index}>
            <circle cx={point.x} cy={point.y} r="5.4" fill="#0f172a" stroke={color} strokeWidth="2.2" />
            <circle cx={point.x} cy={point.y} r="11" fill="transparent" stroke={color} strokeOpacity="0.16" />
            <text x={point.x} y={height - 9} textAnchor="middle" fontSize="10" fill="#94a3b8">{point.label}</text>
          </g>
        ))}
      </svg>
    </div>
  );
}

function MeasurementBarChart({ data }) {
  if (!data || data.length === 0) return null;
  const width = 460;
  const height = 260;
  const padding = 36;
  const max = Math.max(...data.flatMap(item => [item.weight, item.chest || 0, item.waist || 0]), 1);
  const scaleMax = Math.max(10, Math.ceil(max / 10) * 10);
  const chartHeight = height - padding * 2;
  const groupCount = data.slice(-6).length;
  const groupWidth = 54;
  const gap = 12;
  const chartWidth = groupCount * groupWidth + (groupCount - 1) * gap;
  const startX = (width - chartWidth) / 2;
  const ticks = Array.from({ length: 5 }, (_, idx) => (scaleMax / 4) * idx);

  return (
    <div className="mt-4">
      <div className="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <p className="text-sm font-semibold text-white">Weight, Chest & Waist</p>
          <p className="text-xs text-zinc-400">A larger scale for your growing progress and body measurements</p>
        </div>
      </div>
      <svg viewBox={`0 0 ${width} ${height}`} className="h-64 w-full rounded-2xl border border-zinc-800 bg-gradient-to-br from-zinc-950 via-zinc-900 to-zinc-950 p-2 shadow-inner shadow-black/20">
        <line x1={padding} y1={height - padding} x2={width - padding} y2={height - padding} stroke="#52525b" strokeWidth="1" />
        <line x1={padding} y1={padding} x2={padding} y2={height - padding} stroke="#52525b" strokeWidth="1" />
        {ticks.map((tick, idx) => {
          const y = height - padding - (tick / scaleMax) * chartHeight;
          return (
            <g key={idx}>
              <line x1={padding} y1={y} x2={width - padding} y2={y} stroke="#3f3f46" strokeDasharray="4 4" strokeOpacity="0.65" />
              <text x={padding - 8} y={y + 3} textAnchor="end" fontSize="10" fill="#94a3b8">{tick}</text>
            </g>
          );
        })}
        {data.slice(-6).map((item, index) => {
          const baseX = startX + index * (groupWidth + gap);
          const getBarHeight = (value) => (value / scaleMax) * chartHeight;
          const weightH = getBarHeight(item.weight);
          const chestH = getBarHeight(item.chest || 0);
          const waistH = getBarHeight(item.waist || 0);
          return (
            <g key={index}>
              <rect x={baseX} y={height - padding - weightH} width={16} height={weightH} rx="5" fill="#fb923c" fillOpacity="0.95" />
              <rect x={baseX + 20} y={height - padding - chestH} width={13} height={chestH} rx="5" fill="#38bdf8" fillOpacity="0.95" />
              <rect x={baseX + 37} y={height - padding - waistH} width={13} height={waistH} rx="5" fill="#34d399" fillOpacity="0.95" />
              <text x={baseX + groupWidth / 2} y={height - 10} textAnchor="middle" fontSize="9" fill="#94a3b8">{item.label}</text>
              <text x={baseX + 8} y={height - padding - weightH - 6} textAnchor="middle" fontSize="8" fill="#fdba74">{item.weight}</text>
              <text x={baseX + 26} y={height - padding - chestH - 6} textAnchor="middle" fontSize="8" fill="#7dd3fc">{item.chest || 0}</text>
              <text x={baseX + 43} y={height - padding - waistH - 6} textAnchor="middle" fontSize="8" fill="#86efac">{item.waist || 0}</text>
            </g>
          );
        })}
      </svg>
      <div className="mt-3 flex flex-wrap gap-4 text-xs text-zinc-400">
        <span className="flex items-center gap-2"><span className="h-2.5 w-2.5 rounded-full bg-orange-400"></span>Weight</span>
        <span className="flex items-center gap-2"><span className="h-2.5 w-2.5 rounded-full bg-sky-400"></span>Chest</span>
        <span className="flex items-center gap-2"><span className="h-2.5 w-2.5 rounded-full bg-emerald-400"></span>Waist</span>
      </div>
    </div>
  );
}

function ProgressPage({ userProfile }) {
  const [progressEntries, setProgressEntries] = useState(() => Storage.loadProgress());
  const [newEntry, setNewEntry] = useState({ date: new Date().toISOString().split('T')[0], weight: '', chest: '', waist: '', image: null });
  const [imagePreview, setImagePreview] = useState(null);
  const [imageError, setImageError] = useState(null);
  const fileInputRef = useRef(null);

  // Supported image formats and max size
  const SUPPORTED_FORMATS = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'image/bmp', 'image/svg+xml', 'image/tiff', 'image/avif'];
  const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB

  // React-managed file selection and preview generation
  const [selectedFile, setSelectedFile] = useState(null);

  useEffect(() => {
    let cancelled = false;
    setImageError(null);
    if (!selectedFile) {
      setImagePreview(null);
      setNewEntry(prev=>({ ...prev, image: null }));
      return;
    }

    if (selectedFile.size > MAX_FILE_SIZE) {
      setImageError(`File size exceeds 10MB limit. File size: ${(selectedFile.size/1024/1024).toFixed(2)}MB`);
      setSelectedFile(null);
      if (fileInputRef.current) fileInputRef.current.value = '';
      return;
    }

    const ext = '.' + (selectedFile.name.split('.').pop() || '').toLowerCase();
    const supportedExt = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp', '.svg', '.tiff', '.tif', '.avif'];
    const isSupported = SUPPORTED_FORMATS.includes(selectedFile.type) || supportedExt.includes(ext);
    if (!isSupported) {
      setImageError('Unsupported image format.');
      setSelectedFile(null);
      if (fileInputRef.current) fileInputRef.current.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onerror = () => {
      if (cancelled) return;
      setImageError('Failed to read file.');
      setSelectedFile(null);
      if (fileInputRef.current) fileInputRef.current.value = '';
    };
    reader.onload = (ev) => {
      if (cancelled) return;
      const base64 = ev.target?.result;
      setImagePreview(base64);
      setNewEntry(prev => ({ ...prev, image: base64 }));
    };
    reader.readAsDataURL(selectedFile);

    return () => { cancelled = true; };
  }, [selectedFile]);

  const handleImageChange = (e) => {
    setImageError(null);
    const file = e.target.files?.[0];
    if (!file) return setSelectedFile(null);
    setSelectedFile(file);
  };

  const handleAddEntry = () => {
    if (!newEntry.weight) { alert('Please enter weight'); return; }
    const entry = { ...newEntry, weight: Number(newEntry.weight), chest: newEntry.chest ? Number(newEntry.chest) : null, waist: newEntry.waist ? Number(newEntry.waist) : null, id: Date.now() };
    const updated = [...progressEntries, entry].sort((a,b) => new Date(a.date) - new Date(b.date));
    setProgressEntries(updated);
    Storage.saveProgress(updated);
    setNewEntry({ date: new Date().toISOString().split('T')[0], weight: '', chest: '', waist: '', image: null });
    setImagePreview(null); setImageError(null);
    setSelectedFile(null);
    if (fileInputRef.current) fileInputRef.current.value = '';
  };

  const handleDelete = (id) => {
    const updated = progressEntries.filter(e => e.id !== id);
    setProgressEntries(updated);
    Storage.saveProgress(updated);
  };

  const stats = {
    total: progressEntries.length,
    weightChange: progressEntries.length > 1 ? (progressEntries[progressEntries.length - 1].weight - progressEntries[0].weight).toFixed(1) : 0,
    avgWeight: progressEntries.length > 0 ? (progressEntries.reduce((s,e)=>s+e.weight,0)/progressEntries.length).toFixed(1) : 0,
  };

  const sortedEntries = useMemo(() => {
    return [...progressEntries].sort((a, b) => new Date(a.date) - new Date(b.date));
  }, [progressEntries]);

  const trendData = useMemo(() => {
    return sortedEntries.map(entry => ({
      label: entry.date.slice(5),
      value: entry.weight,
    }));
  }, [sortedEntries]);

  const metricData = useMemo(() => {
    return sortedEntries.slice(-6).map(entry => ({
      label: entry.date.slice(5),
      weight: entry.weight,
      chest: entry.chest || 0,
      waist: entry.waist || 0,
    }));
  }, [sortedEntries]);

  return (
    <div className="max-w-7xl mx-auto px-4 py-8">
      <h2 className="text-3xl font-bold mb-8">📈 Progress Tracker</h2>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div className="rounded-xl border border-zinc-700 bg-zinc-800/50 p-6">
          <p className="text-sm text-zinc-400">Total Entries</p>
          <p className="text-3xl font-bold text-orange-400 mt-2">{stats.total}</p>
        </div>
        <div className="rounded-xl border border-zinc-700 bg-zinc-800/50 p-6">
          <p className="text-sm text-zinc-400">Weight Change</p>
          <p className="text-3xl font-bold text-blue-400 mt-2">{stats.weightChange} kg</p>
        </div>
        <div className="rounded-xl border border-zinc-700 bg-zinc-800/50 p-6">
          <p className="text-sm text-zinc-400">Average Weight</p>
          <p className="text-3xl font-bold text-emerald-400 mt-2">{stats.avgWeight} kg</p>
        </div>
      </div>

      {sortedEntries.length >= 2 && (
        <div className="grid grid-cols-1 xl:grid-cols-[1.1fr_0.9fr] gap-6 mb-8">
          <div className="rounded-2xl border border-zinc-700 bg-zinc-800/50 p-6">
            <div className="flex items-center justify-between mb-2">
              <div>
                <h3 className="text-xl font-bold">Weight Trend</h3>
                <p className="text-sm text-zinc-400">A cleaner view of your progress</p>
              </div>
              <div className="rounded-full border border-orange-500/30 bg-orange-500/10 px-3 py-1 text-sm text-orange-300">
                {stats.weightChange} kg
              </div>
            </div>
            <TrendLineChart data={trendData} color="#fb923c" label="Weight" unit="kg" />
          </div>

          <div className="rounded-2xl border border-zinc-700 bg-zinc-800/50 p-6">
            <div className="flex items-center justify-between mb-2">
              <div>
                <h3 className="text-xl font-bold">Body Metrics</h3>
                <p className="text-sm text-zinc-400">Recent measurements at a glance</p>
              </div>
            </div>
            <MeasurementBarChart data={metricData} />
          </div>
        </div>
      )}

      <div className="rounded-xl border border-zinc-700 bg-zinc-800/50 p-6 mb-8">
        <h3 className="text-xl font-bold mb-6">Add New Entry</h3>
        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
          <input type="date" value={newEntry.date} onChange={(e) => setNewEntry(prev=>({ ...prev, date: e.target.value }))} className="rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-2 text-white" />
          <input type="number" step="0.1" placeholder="Weight (kg)" value={newEntry.weight} onChange={(e) => setNewEntry(prev=>({ ...prev, weight: e.target.value }))} className="rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-2 text-white" />
          <input type="number" step="0.1" placeholder="Chest (cm)" value={newEntry.chest} onChange={(e) => setNewEntry(prev=>({ ...prev, chest: e.target.value }))} className="rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-2 text-white" />
          <input type="number" step="0.1" placeholder="Waist (cm)" value={newEntry.waist} onChange={(e) => setNewEntry(prev=>({ ...prev, waist: e.target.value }))} className="rounded-lg border border-zinc-700 bg-zinc-800 px-4 py-2 text-white" />
        </div>

        <div className="mt-4">
          <label className="mb-2 block text-xs font-semibold uppercase text-zinc-400">Progress Photo</label>
          <p className="text-xs text-zinc-500 mb-3">Supported: JPEG, PNG, GIF, WebP, BMP, SVG, TIFF, AVIF (Max 10MB)</p>
          {imageError && <div className="mb-3 rounded-lg border border-red-500/50 bg-red-500/10 p-3"><p className="text-xs text-red-400">⚠️ {imageError}</p></div>}
          <div className="flex gap-4 items-start">
            <input ref={fileInputRef} type="file" accept="image/*" onChange={handleImageChange} className="hidden" />
            <button type="button" onClick={() => fileInputRef.current?.click()} className="rounded-lg bg-orange-500 px-4 py-2 text-sm font-bold text-black hover:bg-orange-400">📷 Upload Image</button>
            {imagePreview && (
              <div className="relative">
                <img src={imagePreview} alt="preview" className="h-20 w-20 rounded-lg object-cover border border-orange-500/50" />
                <button type="button" onClick={() => { setImagePreview(null); setNewEntry(prev=>({ ...prev, image: null })); setImageError(null); setSelectedFile(null); if (fileInputRef.current) fileInputRef.current.value = ''; }} className="absolute -top-2 -right-2 bg-red-500 rounded-full w-6 h-6 flex items-center justify-center text-white text-xs font-bold hover:bg-red-600">✕</button>
              </div>
            )}
          </div>
        </div>

function CaloriesCalculatorPage({ userProfile, setUserProfile }) {
  const [gender, setGender] = useState(userProfile.sex || 'male');
  const [age, setAge] = useState(userProfile.age || 28);
  const [weight, setWeight] = useState(userProfile.currentWeight || 70);
  const [height, setHeight] = useState(userProfile.height || 170);
  const [activityLevel, setActivityLevel] = useState('moderate');
  const [goal, setGoal] = useState(userProfile.goal || 'Maintain Weight');

  const activityFactors = {
    sedentary: 1.2,
    light: 1.375,
    moderate: 1.55,
    active: 1.725,
    athlete: 1.9,
  };

  const goalAdjustments = {
    'Weight Loss': -500,
    'Body Recomposition': -200,
    'Maintain Weight': 0,
    'Strength Building': 250,
    'Lean Muscle Gain': 300,
  };

  const calculation = useMemo(() => {
    const ageValue = Number(age || 0);
    const weightValue = Number(weight || 0);
    const heightValue = Number(height || 0);

    if (!ageValue || !weightValue || !heightValue) {
      return { bmr: 0, tdee: 0, target: 0, valid: false };
    }

    const bmr = gender === 'female'
      ? 10 * weightValue + 6.25 * heightValue - 5 * ageValue - 161
      : 10 * weightValue + 6.25 * heightValue - 5 * ageValue + 5;

    const tdee = Math.round(bmr * (activityFactors[activityLevel] || 1.55));
    const goalShift = goalAdjustments[goal] || 0;
    const target = tdee + goalShift;

    return {
      bmr: Math.round(bmr),
      tdee,
      target,
      valid: true,
    };
  }, [age, activityLevel, gender, goal, height, weight]);

  useEffect(() => {
    if (!calculation.valid) return;
    setUserProfile((prev) => ({
      ...prev,
      sex: gender,
      age: Number(age) || prev.age,
      currentWeight: Number(weight) || prev.currentWeight,
      height: Number(height) || prev.height,
      goal: goal,
      calorieTarget: String(calculation.target),
    }));
  }, [age, calculation.target, calculation.valid, gender, goal, height, setUserProfile, weight]);

  return (
    <div className="max-w-6xl mx-auto px-4 py-8">
      <div className="mb-8">
        <h2 className="text-3xl font-bold text-white">Calories Calculator</h2>
        <p className="mt-2 text-zinc-400">Calculate your daily calorie needs using the Mifflin-St Jeor equation, activity level, and goal adjustment.</p>
      </div>

      <div className="grid grid-cols-1 xl:grid-cols-2 gap-8">
        <div className="rounded-2xl border border-zinc-700 bg-zinc-900/80 p-6">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
              <label className="block text-sm font-semibold text-zinc-400 mb-2">Gender</label>
              <select
                value={gender}
                onChange={(e) => setGender(e.target.value)}
                className="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-4 py-2.5 text-white"
              >
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>

            <div>
              <label className="block text-sm font-semibold text-zinc-400 mb-2">Age</label>
              <input
                type="number"
                min="1"
                value={age}
                onChange={(e) => setAge(e.target.value)}
                className="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-4 py-2.5 text-white"
              />
            </div>

            <div>
              <label className="block text-sm font-semibold text-zinc-400 mb-2">Weight (kg)</label>
              <input
                type="number"
                min="1"
                value={weight}
                onChange={(e) => setWeight(e.target.value)}
                className="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-4 py-2.5 text-white"
              />
            </div>

            <div>
              <label className="block text-sm font-semibold text-zinc-400 mb-2">Height (cm)</label>
              <input
                type="number"
                min="1"
                value={height}
                onChange={(e) => setHeight(e.target.value)}
                className="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-4 py-2.5 text-white"
              />
            </div>

            <div>
              <label className="block text-sm font-semibold text-zinc-400 mb-2">Activity Level</label>
              <select
                value={activityLevel}
                onChange={(e) => setActivityLevel(e.target.value)}
                className="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-4 py-2.5 text-white"
              >
                <option value="sedentary">Sedentary</option>
                <option value="light">Lightly Active</option>
                <option value="moderate">Moderately Active</option>
                <option value="active">Very Active</option>
                <option value="athlete">Athlete / Heavy Training</option>
              </select>
            </div>

            <div>
              <label className="block text-sm font-semibold text-zinc-400 mb-2">Goal</label>
              <select
                value={goal}
                onChange={(e) => setGoal(e.target.value)}
                className="w-full rounded-lg border border-zinc-700 bg-zinc-950 px-4 py-2.5 text-white"
              >
                <option>Weight Loss</option>
                <option>Body Recomposition</option>
                <option>Maintain Weight</option>
                <option>Strength Building</option>
                <option>Lean Muscle Gain</option>
              </select>
            </div>
          </div>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div className="rounded-2xl border border-orange-500/30 bg-orange-500/10 p-5">
            <p className="text-zinc-400 text-sm">BMR</p>
            <p className="mt-3 text-3xl font-bold text-orange-300">{calculation.valid ? calculation.bmr : '—'}</p>
            <p className="mt-2 text-xs text-zinc-400">kcal/day</p>
          </div>

          <div className="rounded-2xl border border-cyan-500/30 bg-cyan-500/10 p-5">
            <p className="text-zinc-400 text-sm">TDEE</p>
            <p className="mt-3 text-3xl font-bold text-cyan-300">{calculation.valid ? calculation.tdee : '—'}</p>
            <p className="mt-2 text-xs text-zinc-400">maintenance calories</p>
          </div>

          <div className="rounded-2xl border border-emerald-500/30 bg-emerald-500/10 p-5">
            <p className="text-zinc-400 text-sm">Target</p>
            <p className="mt-3 text-3xl font-bold text-emerald-300">{calculation.valid ? calculation.target : '—'}</p>
            <p className="mt-2 text-xs text-zinc-400">goal-adjusted calories</p>
          </div>
        </div>
      </div>

      <div className="mt-8 rounded-2xl border border-zinc-700 bg-zinc-900/80 p-6">
        <h3 className="text-xl font-bold text-white mb-5">How the calculation works</h3>
        <ol className="space-y-4 text-zinc-300">
          <li>
            <span className="font-semibold text-white">Step 1:</span> Calculate BMR with the Mifflin-St Jeor formula.
            <div className="mt-2 rounded-xl border border-zinc-700 bg-zinc-950/80 p-3 text-sm text-zinc-300">
              <p>Male: BMR = 10 × weight + 6.25 × height − 5 × age + 5</p>
              <p>Female: BMR = 10 × weight + 6.25 × height − 5 × age − 161</p>
            </div>
          </li>
          <li>
            <span className="font-semibold text-white">Step 2:</span> Multiply by your activity factor to get TDEE.
          </li>
          <li>
            <span className="font-semibold text-white">Step 3:</span> Adjust for your goal: weight loss (-500 kcal), body recomposition (-200 kcal), maintenance (0), strength building / lean gain (+250 to +300 kcal).
          </li>
        </ol>
      </div>
    </div>
  );
}

function BMIPage({ userProfile }) {
  const [tempWeight, setTempWeight] = useState(userProfile.currentWeight || '');
  const [tempHeight, setTempHeight] = useState(userProfile.height || '');

  const bmi = useMemo(() => {
    const weight = Number(tempWeight || 0);
    const heightCm = Number(tempHeight || 0);
    if (weight <= 0 || heightCm <= 0) return null;
    const heightM = heightCm / 100;
    return (weight / (heightM * heightM)).toFixed(1);
  }, [tempWeight, tempHeight]);

    const input = document.getElementById('bmi-photo-input');

    const resultWrap = document.getElementById('bmi-photo-result');

    if (!input || !btn || !estBtn || !clearBtn || !previewWrap || !resultWrap) return;

    let currentDataUrl = null;

    const onFile = (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        currentDataUrl = ev.target.result;
        previewWrap.innerHTML = `<img src="${currentDataUrl}" alt="preview" class="h-48 rounded-md object-contain border"/>`;
        resultWrap.innerHTML = '';
      };
      reader.readAsDataURL(file);
    };

    const onChoose = () => input.click();

    const onClear = () => {
      currentDataUrl = null;
      input.value = '';
      previewWrap.innerHTML = '';
      resultWrap.innerHTML = '';
    };

    const onEstimate = async () => {
      resultWrap.innerHTML = '';
      if (!currentDataUrl) { resultWrap.innerHTML = '<p class="text-sm text-yellow-300">Please upload a photo first.</p>'; return; }

          resultWrap.innerHTML = html;

          resultWrap.innerHTML = `<p class="text-sm text-red-400">Image estimation failed: ${String(err.message)}</p>`;
        }
      } else {
